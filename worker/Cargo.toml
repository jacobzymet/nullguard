[package]
name = "nullguard-worker"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Headless vault worker and private desktop protocol for nullguard"

[dependencies]
nullguard = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.9", features = ["serde"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[features]
macos-no-mount = ["nullguard/macos-no-mount"]

[lints.rust]
unsafe_code = "deny"
