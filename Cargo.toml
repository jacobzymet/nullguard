[package]
name = "nullguard"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Encrypted vault containers that mount as drives. A small, quantum-resistant VeraCrypt alternative."
rust-version = "1.89"

[workspace]
members = ["desktop"]
default-members = ["."]
resolver = "3"

[dependencies]
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize", "parallel"] }
zeroize = { version = "1.9", features = ["derive"] }
unicode-normalization = "0.1"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
getrandom = "0.4"
base64ct = "1.8"
clap = { version = "4.6", features = ["derive"] }
rpassword = "7.5"
region = "3"
anyhow = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Ctrl-C and SIGTERM unmount. (Windows has its own console handler, which
# waits for the commit before the process may end.)
ctrlc = { version = "3.5", features = ["termination"] }

# Windows API declarations (Microsoft's official crate), for mounting
# through WinFsp. WinFsp itself is installed by the user and loaded at run
# time, so nothing of it is linked or bundled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.18" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Integer overflow is a security bug: keep the checks in release builds.
overflow-checks = true

# Crypto (especially Argon2) is unbearably slow unoptimized; optimize
# dependencies even in debug/test builds.
[profile.dev.package."*"]
opt-level = 3

[features]
# Type-check / build on macOS without macFUSE installed (mounting disabled).
macos-no-mount = ["fuser/macos-no-mount"]

# `fuzzing` is set by cargo-fuzz for the fuzz tests in fuzz/.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
