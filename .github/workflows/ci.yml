name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
          - os: windows-latest
            features: ""
          # macOS runners can't load macFUSE; type-check and test without mounting.
          - os: macos-latest
            features: "--features macos-no-mount"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test --locked ${{ matrix.features }}

  mount-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: cargo build --release --locked
      - name: Mount test (as a normal user)
        run: ./scripts/mount-test.sh target/release/nullguard
      - name: Mount test (as root, adds cross-user ownership and isolation checks)
        run: sudo ./scripts/mount-test.sh target/release/nullguard

  mount-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install winfsp -y --no-progress
      - run: cargo build --release --locked
      - name: Mount test (WinFsp)
        shell: bash
        run: ./scripts/mount-test-windows.sh target/release/nullguard.exe

  # Known-vulnerable or yanked dependencies fail the build.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny yanked

  release-binaries:
    needs: [test, mount-test, mount-test-windows, audit]
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.os == 'macos-latest'
        run: brew install --cask macfuse && brew install pkgconf
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Checksums
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          for f in nullguard nullguard.exe; do
            if [ -f "$f" ]; then
              if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
            fi
          done
      - uses: actions/upload-artifact@v5
        with:
          name: nullguard-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/nullguard
            target/${{ matrix.target }}/release/nullguard.exe
            target/${{ matrix.target }}/release/*.sha256
