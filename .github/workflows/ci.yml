name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the repository.
# Every action is pinned to an exact commit (a tag can be moved to other
# code; these jobs build the release binaries). Dependabot proposes updates.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
          - os: windows-latest
            features: ""
          # macOS runners can't load macFUSE; type-check and test without mounting.
          - os: macos-latest
            features: "--features nullguard/macos-no-mount,nullguard-desktop/macos-no-mount"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --locked --all-targets ${{ matrix.features }} -- -D warnings
      - name: Public documentation
        run: cargo doc --workspace --locked --no-deps ${{ matrix.features }}
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Windows test caller privileges
        if: runner.os == 'Windows'
        run: whoami /priv
      - run: cargo test --workspace --locked ${{ matrix.features }}

  mount-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: cargo build --release --locked
      - name: Mount test (as a normal user)
        run: ./scripts/mount-test.sh target/release/nullguard
      - name: Mount test (as root, adds cross-user ownership and isolation checks)
        run: sudo ./scripts/mount-test.sh target/release/nullguard
      - name: Desktop create, mount, lock, reopen, and parent disconnect
        run: cargo test -p nullguard-desktop --locked --test worker -- --ignored --test-threads=1

  mount-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: choco install winfsp -y --no-progress
      - run: cargo build --release --locked
      - name: Mount test (WinFsp)
        shell: bash
        run: ./scripts/mount-test-windows.sh target/release/nullguard.exe
      - name: Desktop create, mount, lock, reopen, and parent disconnect (WinFsp)
        run: cargo test -p nullguard-desktop --locked --test worker -- --ignored --test-threads=1

  # Known-vulnerable or yanked dependencies fail the build.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny yanked

  release-binaries:
    needs: [test, mount-test, mount-test-windows, audit]
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.os == 'macos-latest'
        run: brew install --cask macfuse && brew install pkgconf
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Checksums
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          for f in nullguard nullguard.exe; do
            if [ -f "$f" ]; then
              if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
            fi
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nullguard-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/nullguard
            target/${{ matrix.target }}/release/nullguard.exe
            target/${{ matrix.target }}/release/*.sha256

  desktop-binaries:
    needs: [test, mount-test, mount-test-windows, audit]
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: matrix.os == 'macos-latest'
        run: brew install --cask macfuse && brew install pkgconf
      - run: cargo build -p nullguard-desktop --release --locked --target ${{ matrix.target }}
      - name: Package desktop app and checksums
        shell: bash
        run: ./scripts/package-desktop.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nullguard-desktop-${{ matrix.target }}
          path: dist/desktop/*
