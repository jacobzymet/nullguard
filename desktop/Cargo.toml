[package]
name = "nullguard-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A desktop interface for nullguard encrypted vaults"

[dependencies]
nullguard = { path = ".." }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.9", features = ["serde"] }
directories = "6"
anyhow = "1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[dev-dependencies]
tempfile = "3"

[features]
macos-no-mount = ["nullguard/macos-no-mount"]

[lints.rust]
unsafe_code = "deny"
